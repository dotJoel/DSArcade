<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Binary Search Trainer — DSA Arcade</title>
<link rel="stylesheet" href="../assets/style.css">
<style>
  .row { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; margin: 18px 0; }
  .cell {
    width: 52px; height: 52px; border-radius: 10px; border: 1px solid #34384d;
    background: #232634; color: var(--text); font-size: 16px; cursor: pointer; font-weight: 600;
  }
  .cell:hover:not(:disabled) { border-color: var(--accent); }
  .cell:disabled { cursor: default; }
  .cell.out { opacity: 0.22; cursor: default; }
  .cell.used { opacity: 0.45; cursor: default; }
  .cell.correct { background: #1d3324; border-color: var(--good); color: #7ef0a8; }
  .cell.wrong { background: #3a1d22; border-color: var(--bad); color: #ff9b9b; }
  .cell.found { background: #1d3324; border-color: var(--good); color: #7ef0a8; }
  .search-meta { text-align: center; color: var(--muted); font-size: 13px; margin-top: 8px; }
</style>
</head>
<body>
<div class="app">
  <div class="card screen" id="startScreen">
    <h1>Binary Search Trainer</h1>
    <p>Find the target in a sorted array — or prove it isn’t there. Each click reveals whether your guess is too low or too high. Use fewer comparisons to score more.</p>
    <p id="modeInfo" style="font-size:13px;color:#6c7086"></p>
    <div style="margin-bottom:20px">
      <button class="btn" onclick="start()">Start</button>
    </div>
    <a class="hlink" href="../index.html">← All games</a>
  </div>

  <div id="gameScreen" style="display:none">
    <div class="header">
      <span class="qnum" id="qnum"></span>
      <span class="streak">Streak <b id="streakNum">0</b> · Score <b id="scoreNum" style="color:#4f8cff">0</b></span>
    </div>
    <div class="card">
      <div class="problem" id="problem"></div>
      <div class="row" id="row"></div>
      <div class="search-meta" id="searchMeta"></div>
      <div class="feedback" id="feedback"></div>
      <button class="next-btn" id="nextBtn" onclick="next()">Next →</button>
    </div>
  </div>

  <div class="card screen" id="endScreen" style="display:none">
    <h1 id="endTitle"></h1>
    <div class="stats">
      <div><b id="endScore">0</b><span>Score</span></div>
      <div><b id="endBest">0</b><span>Best streak</span></div>
      <div><b id="endRounds">0</b><span>Optimal</span></div>
    </div>
    <p id="endMsg"></p>
    <button class="btn" onclick="start()">Play again</button>
    <a class="btn secondary" style="display:inline-block;text-decoration:none" href="../index.html">All games</a>
  </div>
</div>
<script src="../assets/app.js"></script>
<script>
'use strict';
const ROUNDS = isDaily() ? 5 : 8;
const $ = id => document.getElementById(id);
const daily = isDaily();
document.getElementById('modeInfo').textContent = daily
  ? 'Daily: the same 5 searches for everyone today. Find each target in as few comparisons as you can.'
  : `Practice: ${ROUNDS} generated searches.`;

let rng, round = 0, score = 0, streak = 0, bestStreak = 0, resolved = 0, optimalRounds = 0;
let arr = [], target = 0, lo = 0, hi = 0, comparisons = 0, done = false;
let par = 0, used = new Set(), foundIndex = null;

function rand() { return daily ? rng() : Math.random(); }

// Replays the deterministic rng draws of one generated round without
// rendering it, so a resumed session lands on the same round as a fresh one.
function skipGeneratedRound() {
  const n = 16 + Math.floor(rand() * 9);
  rand();
  for (let i = 0; i < n; i++) rand();
  rand();
  rand();
}

function start() {
  if (daily) rng = mulberry32(hashStr(todayKey() + ':binsearch'));
  const saved = daily ? dailyProgress('binsearch') : null;
  if (saved) {
    round = saved.round; score = saved.score; streak = saved.streak;
    bestStreak = saved.bestStreak; resolved = saved.resolved; optimalRounds = saved.optimalRounds;
    $('startScreen').style.display = 'none';
    $('endScreen').style.display = 'none';
    $('gameScreen').style.display = 'block';
    $('scoreNum').textContent = score;
    $('streakNum').textContent = streak;
    if (round >= ROUNDS) { end(); }
    else {
      for (let r = 0; r < round; r++) skipGeneratedRound();
      newRound();
      showFeedback(`Resumed at search ${round + 1} — score ${score}.`, true);
    }
    return;
  }
  round = 0; score = 0; streak = 0; bestStreak = 0; resolved = 0; optimalRounds = 0;
  $('startScreen').style.display = 'none';
  $('endScreen').style.display = 'none';
  $('gameScreen').style.display = 'block';
  newRound();
}

function newRound() {
  const n = 16 + Math.floor(rand() * 9); // 16..24 sorted values
  arr = [];
  let v = Math.floor(rand() * 9);
  for (let i = 0; i < n; i++) { v += 2 + Math.floor(rand() * 10); arr.push(v); }
  const present = rand() < 0.72;
  if (present) target = arr[Math.floor(rand() * n)];
  else {
    // Choose a value strictly between the array extremes that is not present.
    const gaps = [];
    for (let i = 0; i < arr.length - 1; i++) {
      for (let x = arr[i] + 1; x < arr[i + 1]; x++) gaps.push(x);
    }
    target = gaps[Math.floor(rand() * gaps.length)];
  }
  lo = 0; hi = n - 1; comparisons = 0; done = false; used = new Set(); foundIndex = null;
  par = Math.ceil(Math.log2(n + 1));
  $('feedback').className = 'feedback';
  $('nextBtn').style.display = 'none';
  $('qnum').textContent = `Search ${round + 1} of ${ROUNDS}${daily ? ' · Daily' : ' · Practice'}`;
  $('problem').innerHTML = `Find <code>${target}</code>. Pick a value to compare; use the clues to narrow the search.`;
  renderRow();
  updateMeta();
}

function renderRow() {
  const row = $('row'); row.innerHTML = '';
  arr.forEach((v, i) => {
    const b = document.createElement('button');
    b.className = 'cell' + (i < lo || i > hi ? ' out' : '') + (used.has(i) ? ' used' : '') + (i === foundIndex ? ' found' : '');
    b.textContent = v;
    b.disabled = done || i < lo || i > hi || used.has(i);
    b.onclick = () => guess(i, b);
    row.appendChild(b);
  });
}

function updateMeta() {
  const bounds = lo <= hi ? `Search range: indices ${lo}–${hi} (${hi - lo + 1} values)` : 'Search range is empty';
  $('searchMeta').textContent = `${bounds} · Comparisons: ${comparisons}/${par} for optimal`;
}

function guess(i, btn) {
  if (done || i < lo || i > hi || used.has(i)) return;
  const value = arr[i];
  comparisons++;
  used.add(i);
  if (value === target) {
    foundIndex = i;
    finishRound(true, `🎯 Found ${target} after ${comparisons} comparison${comparisons === 1 ? '' : 's'}.`);
    return;
  }

  if (value < target) {
    lo = i + 1;
    btn.classList.add('correct');
    showFeedback(`${value} is too low — target is higher. Discard indices through ${i}.`, true);
  } else {
    hi = i - 1;
    btn.classList.add('correct');
    showFeedback(`${value} is too high — target is lower. Discard indices from ${i}.`, true);
  }

  if (lo > hi) {
    finishRound(false, `✅ The range is empty, so ${target} is not in the array. Proven in ${comparisons} comparison${comparisons === 1 ? '' : 's'}.`);
    return;
  }
  renderRow();
  updateMeta();
}

function showFeedback(text, ok) {
  const f = $('feedback');
  f.className = 'feedback show ' + (ok ? 'ok' : 'no');
  f.textContent = text;
}

function finishRound(found, message) {
  done = true;
  resolved++;
  const optimal = comparisons <= par;
  if (optimal) {
    optimalRounds++;
    streak++;
    bestStreak = Math.max(bestStreak, streak);
    const gained = Math.max(30, 120 + (par - comparisons) * 25 + streak * 15);
    score += gained;
    message += ` Optimal search (+${gained} points).`;
  } else {
    streak = 0;
    const gained = 30;
    score += gained;
    message += ` ${comparisons - par} over the optimal budget (+${gained} points).`;
  }
  showFeedback(message, optimal);
  renderRow();
  updateMeta();
  $('scoreNum').textContent = score;
  $('streakNum').textContent = streak;
  $('nextBtn').style.display = 'block';
  $('nextBtn').textContent = round + 1 < ROUNDS ? 'Next search →' : 'See results →';
  if (daily) saveDailyProgress('binsearch', { round: round + 1, score, streak, bestStreak, resolved, optimalRounds });
}

function next() {
  round++;
  if (round < ROUNDS) newRound();
  else end();
}

function end() {
  if (daily) clearDailyProgress('binsearch');
  $('gameScreen').style.display = 'none';
  $('endScreen').style.display = 'block';
  $('endScore').textContent = score;
  $('endBest').textContent = bestStreak;
  $('endRounds').textContent = `${optimalRounds}/${ROUNDS}`;
  if (daily) {
    const prev = dailyState('binsearch');
    const res = {
      score: prev ? Math.max(prev.score, score) : score,
      best: prev ? Math.max(prev.best, bestStreak) : bestStreak
    };
    saveDaily('binsearch', res);
  }
  $('endTitle').textContent = optimalRounds === ROUNDS ? 'Optimal search 🎯' : optimalRounds >= ROUNDS / 2 ? 'Good search instincts 👍' : 'Reduce the range 📚';
  $('endMsg').textContent = `${optimalRounds} of ${ROUNDS} searches were resolved within the comparison budget. Binary search works by discarding half the remaining range after each comparison.`;
}
</script>
</body>
</html>
