<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Binary Search Trainer — DSA Arcade</title>
<link rel="stylesheet" href="../assets/style.css">
<style>
  .row { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; margin: 18px 0; }
  .cell {
    width: 52px; height: 52px; border-radius: 10px; border: 1px solid #34384d;
    background: #232634; color: var(--text); font-size: 16px; cursor: pointer; font-weight: 600;
  }
  .cell:hover:not(:disabled) { border-color: var(--accent); }
  .cell:disabled { cursor: default; }
  .cell.out { opacity: 0.25; }
  .cell.mid { border-color: var(--accent); color: #9cc4ff; }
  .cell.correct { background: #1d3324; border-color: var(--good); color: #7ef0a8; }
  .cell.wrong { background: #3a1d22; border-color: var(--bad); color: #ff9b9b; }
  .cell.found { background: #1d3324; border-color: var(--good); color: #7ef0a8; }
</style>
</head>
<body>
<div class="app">
  <div class="card screen" id="startScreen">
    <h1>Binary Search Trainer</h1>
    <p>Click the index a correct binary search examines next. Bounds and target are given; the game is procedurally generated, so it never repeats.</p>
    <p id="modeInfo" style="font-size:13px;color:#6c7086"></p>
    <div style="margin-bottom:20px">
      <button class="btn" onclick="start()">Start</button>
    </div>
    <a class="hlink" href="../index.html">← All games</a>
  </div>

  <div id="gameScreen" style="display:none">
    <div class="header">
      <span class="qnum" id="qnum"></span>
      <span class="streak">Streak <b id="streakNum">0</b> · Score <b id="scoreNum" style="color:#4f8cff">0</b></span>
    </div>
    <div class="card">
      <div class="problem" id="problem"></div>
      <div class="row" id="row"></div>
      <div class="feedback" id="feedback"></div>
      <button class="next-btn" id="nextBtn" onclick="next()">Next →</button>
    </div>
  </div>

  <div class="card screen" id="endScreen" style="display:none">
    <h1 id="endTitle"></h1>
    <div class="stats">
      <div><b id="endScore">0</b><span>Score</span></div>
      <div><b id="endBest">0</b><span>Best streak</span></div>
      <div><b id="endRounds">0</b><span>Rounds won</span></div>
    </div>
    <p id="endMsg"></p>
    <button class="btn" onclick="start()">Play again</button>
    <a class="btn secondary" style="display:inline-block;text-decoration:none" href="../index.html">All games</a>
  </div>
</div>
<script src="../assets/app.js"></script>
<script>
'use strict';
const ROUNDS = isDaily() ? 5 : 8;
const $ = id => document.getElementById(id);
const daily = isDaily();
document.getElementById('modeInfo').textContent = daily
  ? 'Daily: the same 5 generated searches for everyone today.'
  : `Practice: ${ROUNDS} generated searches.`;

let rng, round = 0, score = 0, streak = 0, bestStreak = 0, wins = 0;
let arr = [], target = 0, lo = 0, hi = 0, solved = false;

function start() {
  if (daily) rng = mulberry32(hashStr(todayKey() + ':binsearch'));
  round = 0; score = 0; streak = 0; bestStreak = 0; wins = 0;
  $('startScreen').style.display = 'none';
  $('endScreen').style.display = 'none';
  $('gameScreen').style.display = 'block';
  next();
}

function newRound() {
  const n = 10 + Math.floor((daily ? rng() : Math.random()) * 7); // 10..16 cells
  arr = [];
  let v = Math.floor((daily ? rng() : Math.random()) * 9);
  for (let i = 0; i < n; i++) { v += 1 + Math.floor((daily ? rng() : Math.random()) * 12); arr.push(v); }
  const present = (daily ? rng() : Math.random()) < 0.7;
  if (present) target = arr[Math.floor((daily ? rng() : Math.random()) * n)];
  else { do { target = arr[0] + Math.floor((daily ? rng() : Math.random()) * (arr[n-1] - arr[0] + 3)); } while (arr.includes(target)); }
  lo = 0; hi = n - 1; solved = false;
  $('feedback').className = 'feedback';
  $('nextBtn').style.display = 'none';
  $('qnum').textContent = `Search ${Math.min(round + 1, ROUNDS)} of ${ROUNDS}${daily ? ' · Daily' : ' · Practice'}`;
  $('problem').innerHTML = `Target: <code>${target}</code> — click the next index a correct binary search examines.`;
  renderRow();
}

function renderRow() {
  const row = $('row'); row.innerHTML = '';
  arr.forEach((v, i) => {
    const b = document.createElement('button');
    b.className = 'cell' + (i < lo || i > hi ? ' out' : '');
    b.textContent = v;
    b.onclick = () => pick(i, b);
    row.appendChild(b);
  });
}

function correctMid() { return (lo + hi) >> 1; }

function pick(i, btn) {
  if (solved) return;
  const cm = correctMid();
  const cells = document.querySelectorAll('.cell');
  if (i === cm) {
    const m = cm;
    if (arr[m] === target) {
      btn.classList.add('found'); solved = true; wins++;
      streak++; bestStreak = Math.max(bestStreak, streak);
      score += 100 + streak * 20;
      fb(`✅ Found at index ${m} in this step (+${100 + streak * 20}).`, true);
    } else if (arr[m] < target) {
      lo = m + 1; btn.classList.add('correct');
      score += 25;
      fb(`Right — arr[${m}] = ${arr[m]} < ${target}, so the target can only be right of it. lo = ${lo}.`, true);
    } else {
      hi = m - 1; btn.classList.add('correct');
      score += 25;
      fb(`Right — arr[${m}] = ${arr[m]} > ${target}, so the target can only be left of it. hi = ${hi}.`, true);
    }
  } else {
    solved = true;
    streak = 0;
    cells[cm].classList.add('correct');
    btn.classList.add('wrong');
    fb(`❌ A correct binary search examines index ${cm} — the mid of lo=${lo}, hi=${hi}, i.e. (${lo}+${hi})>>1 = ${cm}.`, false);
  }
  cells.forEach(c => c.disabled = true);
  $('scoreNum').textContent = score;
  $('streakNum').textContent = streak;
  $('nextBtn').style.display = 'block';
  $('nextBtn').textContent = round + 1 < ROUNDS ? 'Next →' : 'See results →';
}

function fb(html, ok) {
  const f = $('feedback');
  f.className = 'feedback show ' + (ok ? 'ok' : 'no');
  f.innerHTML = html;
}

function next() {
  round++;
  if (round <= ROUNDS) newRound();
  else end();
}

function end() {
  $('gameScreen').style.display = 'none';
  $('endScreen').style.display = 'block';
  $('endScore').textContent = score;
  $('endBest').textContent = bestStreak;
  $('endRounds').textContent = wins + '/' + ROUNDS;
  if (daily) {
    const prev = dailyState('binsearch');
    const res = { score: prev ? Math.max(prev.score, score) : score, best: prev ? Math.max(prev.best, bestStreak) : bestStreak };
    saveDaily('binsearch', res);
  }
  $('endTitle').textContent = wins === ROUNDS ? 'Perfect bounds 🎯' : wins >= ROUNDS / 2 ? 'Solid 👍' : 'Keep drilling 📚';
  $('endMsg').textContent = wins === ROUNDS
    ? 'Your mid calculations are automatic. Now write it without overflow bugs.'
    : 'The mid is always (lo + hi) >> 1 of the *current* bounds — check the shaded region before clicking.';
}
</script>
</body>
</html>
